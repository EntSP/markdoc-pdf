[package]
name = "markdoc-pdf"
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/entsp/markdoc"

[lib]
name = "markdoc_pdf"
path = "src/lib.rs"

[[bin]]
name = "markdoc-pdf"
path = "src/main.rs"

[dependencies]
markdoc    = { path = "../markdoc" }
flux-types = { path = "../flux-types" }

# PDF / layout stack — these used to be `*.workspace = true` against
# the markdoc workspace. Now standalone: pin the same versions
# inline. Keep these in lockstep with leptos-markdoc when shared.
krilla     = "0.8"
krilla-svg = "0.8"
parley     = "0.11"
usvg       = "0.47"   # pinned to match krilla-svg 0.8's internal usvg
fontdb     = "0.23"
image      = "0.25"

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml       = "1.1"
clap       = { version = "4.6", features = ["derive"] }
thiserror  = "2.0"
time       = { version = "0.3", default-features = false, features = ["std", "local-offset", "parsing", "macros"] }
ureq       = { version = "3", default-features = false, features = ["rustls"] }
hyphenation = { version = "0.8", default-features = false, features = ["embed_en-us"] }
qrcodegen = "1.8.0"
