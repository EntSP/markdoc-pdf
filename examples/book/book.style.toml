# Book theme for the composed `sections` example: auto-numbered headings, a
# start-position ToC, a title cover, coloured callouts, a footer with the
# document number, and a last-page QR — all spanning the stitched whole.
page_width  = 595.0
page_height = 842.0
margin_x    = 62.0
margin_y    = 64.0
body_font_size        = 10.5
body_line_height      = 1.45
paragraph_space_after = 9.0
text_color = { r = 40, g = 44, b = 52 }

table_borders = "grid"
table_border_color = { r = 210, g = 215, b = 225 }
table_header_background = { r = 232, g = 235, b = 240 }
table_cell_padding = 5.0
table_stripe_color = { r = 246, g = 248, b = 251 }

[link]
color = { r = 0, g = 102, b = 204 }

[heading_numbering]
enabled = true
max_depth = 3

[heading.h1]
color = { r = 0, g = 48, b = 135 }
font_size = 21.0
[heading.h2]
color = { r = 0, g = 48, b = 135 }
font_size = 15.0
[heading.h3]
color = { r = 0, g = 48, b = 135 }
font_size = 12.5

[list_marker]
badge = true
ordered_sequences = ["decimal"]

# Coloured callouts (label + left accent, no icon assets needed).
[callout_styles.info]
accent = { r = 0, g = 102, b = 204 }
label = "INFO"
[callout_styles.notice]
accent = { r = 0, g = 150, b = 100 }
label = "NOTICE"
[callout_styles.caution]
accent = { r = 235, g = 180, b = 20 }
label = "CAUTION"
[callout_styles.warning]
accent = { r = 235, g = 120, b = 0 }
label = "WARNING"

[toc]
enabled = true
position = "start"
title = "Contents"

[coverpage]
enabled = true
align = "left"
title_font_size = 34.0
title_accent = " {documentType}"
title_accent_color = { r = 0, g = 48, b = 135 }
show_authors = false
show_date = false
detail_lines = [
  "Version: {version} ({language})",
  "Document: {documentNumber}",
]

[page_decoration]
skip_first_page = true

[page_decoration.footer]
left = "{title} {documentType} · v.{version} · document {documentNumber}"
right = "{page}"

[page_decoration.last_page_qr]
size = 52.0
# align = "center"   # which bottom corner: left | center | right (default)
margin_right = 46.0
margin_bottom = 50.0
color = { r = 0, g = 48, b = 135 }
